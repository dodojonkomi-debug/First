server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver-и дохилии Docker — то номи "backend" ҳангоми кор (на оғоз) ҳал шавад
    resolver 127.0.0.11 ipv6=off valid=10s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback — ҳамаи маршрутҳо ба index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксии API ба backend (тағйирёбанда → nginx ҳангоми оғоз қатъ намешавад)
    location /api {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage {
        set $backend_storage backend;
        proxy_pass http://$backend_storage:80;
        proxy_set_header Host $host;
    }

    # Кэши assets
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
